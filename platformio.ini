; Daedric Grimoire — a companion app for the Daedric Launcher on the
; M5Stack Cardputer ADV: drone box, step sequencer, bytebeat livecoder,
; ASCII 3D and visions, in the same blood/ember skin.
;
;   pio run -e cardputer            -> .pio/build/cardputer/firmware.bin (install via Launcher SD)
;   pio run -e native -t exec       -> SDL window on the desktop (see src/hal_native.cpp)

[platformio]
default_envs = cardputer

[env:cardputer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_unflags = -std=gnu++11 -std=gnu++2b
build_flags =
	-std=gnu++17
	-O2
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DGRIM_DEVICE=1
lib_deps =
	m5stack/M5Cardputer @ 1.1.1
	m5stack/M5Unified @ 0.2.24
	m5stack/M5GFX @ 0.2.31
build_src_filter = +<*> -<hal_native.cpp> -<net_native.cpp>
monitor_speed = 115200

[env:native]
platform = native
build_flags =
	-std=c++17
	-O2
	-lSDL2
	-lpthread
	-DGRIM_NATIVE=1
	-DLGFX_USE_V1
lib_deps =
	lovyan03/LovyanGFX @ 1.2.32
build_src_filter = +<*> -<hal_device.cpp> -<net_device.cpp>
