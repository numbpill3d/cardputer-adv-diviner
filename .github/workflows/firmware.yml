name: Firmware build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cardputer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.2.0
      - name: Build Cardputer firmware
        run: pio run -e cardputer
